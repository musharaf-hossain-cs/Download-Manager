[workspace]
members = []
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99.1"
license = "LicenseRef-Proprietary"
repository = "https://github.com/musharaf-hossain-cs/Download-Manager"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }

