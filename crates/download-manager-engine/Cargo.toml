[package]
name = "download-manager-engine"
description = "Core transfer engine for Download Manager"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
httpdate = "1.0.3"
md5 = { package = "md-5", version = "0.10.6" }
percent-encoding = "2.3.2"
reqwest = { version = "0.12.24", default-features = false, features = ["blocking", "rustls-tls"] }
rusqlite = { version = "0.37.0", features = ["bundled"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
sha2 = "0.10.9"
sha1 = "0.10.6"
thiserror = "2.0.17"
url = "2.5.7"
uuid = { version = "1.20.0", features = ["serde", "v4"] }

[dev-dependencies]
tempfile = "3.23.0"

[lints]
workspace = true

