name: Security policy

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "23 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dependency-policy:
    name: Dependency and license audit
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
      - name: Activate pinned pnpm
        shell: pwsh
        run: |
          corepack enable
          corepack prepare pnpm@12.15.0 --activate
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Install pinned Rust toolchain
        shell: pwsh
        run: rustup toolchain install 1.99.1 --profile minimal
      - name: Install checksummed Rust audit tools
        shell: pwsh
        run: |
          $toolRoot = Join-Path $env:RUNNER_TEMP 'rust-audit-tools'
          $auditArchive = Join-Path $toolRoot 'cargo-audit.zip'
          $denyArchive = Join-Path $toolRoot 'cargo-deny.tar.gz'
          New-Item -ItemType Directory -Path $toolRoot | Out-Null
          Invoke-WebRequest `
            -Uri 'https://github.com/rustsec/rustsec/releases/download/cargo-audit%2Fv0.22.2/cargo-audit-x86_64-pc-windows-msvc-v0.22.2.zip' `
            -OutFile $auditArchive
          Invoke-WebRequest `
            -Uri 'https://github.com/EmbarkStudios/cargo-deny/releases/download/0.20.2/cargo-deny-0.20.2-x86_64-pc-windows-msvc.tar.gz' `
            -OutFile $denyArchive
          $auditHash = (Get-FileHash -LiteralPath $auditArchive -Algorithm SHA256).Hash.ToLowerInvariant()
          $denyHash = (Get-FileHash -LiteralPath $denyArchive -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($auditHash -ne '0a7316540862c13d954f648917ceacca593747baed6eec180fafa590be2710ab') {
            throw "cargo-audit archive checksum mismatch: $auditHash"
          }
          if ($denyHash -ne '975a22143262fd27476d19ee00c7af67978426e40e1dee94eed6bbade1cf87dc') {
            throw "cargo-deny archive checksum mismatch: $denyHash"
          }
          Expand-Archive -LiteralPath $auditArchive -DestinationPath (Join-Path $toolRoot 'audit')
          tar -xf $denyArchive -C $toolRoot
          $auditBin = (Get-ChildItem $toolRoot -Recurse -Filter 'cargo-audit.exe' | Select-Object -First 1).Directory.FullName
          $denyBin = (Get-ChildItem $toolRoot -Recurse -Filter 'cargo-deny.exe' | Select-Object -First 1).Directory.FullName
          @($auditBin, $denyBin) | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Run dependency and license policy
        shell: pwsh
        run: ./scripts/security-quality.ps1

  secrets:
    name: Secret scan
    runs-on: windows-latest
    steps:
      - name: Check out full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install pinned Gitleaks
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP 'gitleaks.zip'
          $destination = Join-Path $env:RUNNER_TEMP 'gitleaks'
          Invoke-WebRequest `
            -Uri 'https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_windows_x64.zip' `
            -OutFile $archive
          $actualHash = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          $expectedHash = 'd29144deff3a68aa93ced33dddf84b7fdc26070add4aa0f4513094c8332afc4e'
          if ($actualHash -ne $expectedHash) {
            throw "Gitleaks archive checksum mismatch: $actualHash"
          }
          Expand-Archive -LiteralPath $archive -DestinationPath $destination
          $destination | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Scan committed history
        run: gitleaks git --config .gitleaks.toml --redact --no-banner
